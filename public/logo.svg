<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="alpinex_brand_grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5B37" />
      <stop offset="0.5" stop-color="#FF6E4D" />
      <stop offset="1" stop-color="#FFA07A" />
    </linearGradient>
    <filter id="alpinex_shadow" x="0" y="0" width="60" height="60" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5B37" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Emblem (48x48) -->
  <g transform="translate(6, 6)" filter="url(#alpinex_shadow)">
    <rect width="48" height="48" rx="14" fill="url(#alpinex_brand_grad)" />
    
    <!-- Outer Orbit Ring -->
    <circle cx="24" cy="24" r="16" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="1.5 2" />
    
    <!-- 4 Cardinal Ticks -->
    <line x1="24" y1="4" x2="24" y2="7.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="24" y1="40.5" x2="24" y2="44" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="24" x2="7.5" y2="24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="40.5" y1="24" x2="44" y2="24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- 4 Diagonal Diamond Hints -->
    <polygon points="24,16 27,24 24,24 24,16" fill="#FFFFFF" fill-opacity="0.4" />
    <polygon points="32,24 24,27 24,24 32,24" fill="#FFFFFF" fill-opacity="0.3" />
    <polygon points="24,32 21,24 24,24 24,32" fill="#FFFFFF" fill-opacity="0.4" />
    <polygon points="16,24 24,21 24,24 16,24" fill="#FFFFFF" fill-opacity="0.3" />

    <!-- Faceted Compass Star -->
    <polygon points="24,7 24,24 9,24" fill="#FFFFFF" />
    <polygon points="24,7 24,24 39,24" fill="#FFE5DF" />
    <polygon points="24,41 24,24 9,24" fill="#FFC7BA" />
    <polygon points="24,41 24,24 39,24" fill="#FF9E8A" />

    <!-- Center Pivot Pin -->
    <circle cx="24" cy="24" r="3" fill="#0B1520" />
    <circle cx="24" cy="24" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Wordmark "ALPINEX" -->
  <text x="68" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="4.5" fill="#0B1520">ALPINEX</text>

  <!-- Subtitle "CURATED EXPEDITIONS" -->
  <text x="69" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.8" fill="#FF5B37">CURATED EXPEDITIONS</text>
</svg>

