<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="alpinex_ico_grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5B37" />
      <stop offset="0.5" stop-color="#FF6E4D" />
      <stop offset="1" stop-color="#FFA07A" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="9" fill="url(#alpinex_ico_grad)" />

  <!-- Outer Orbit Ring -->
  <circle cx="16" cy="16" r="10.5" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="1 1.5" />

  <!-- 4 Cardinal Guide Ticks -->
  <line x1="16" y1="2.5" x2="16" y2="5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  <line x1="16" y1="27" x2="16" y2="29.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  <line x1="2.5" y1="16" x2="5" y2="16" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  <line x1="27" y1="16" x2="29.5" y2="16" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

  <!-- Faceted 4-Point North Star & Alpine Compass -->
  <polygon points="16,5 16,16 6,16" fill="#FFFFFF" />
  <polygon points="16,5 16,16 26,16" fill="#FFE5DF" />
  <polygon points="16,27 16,16 6,16" fill="#FFC7BA" />
  <polygon points="16,27 16,16 26,16" fill="#FF9E8A" />

  <!-- Center Pin -->
  <circle cx="16" cy="16" r="2" fill="#0B1520" />
  <circle cx="16" cy="16" r="1" fill="#FFFFFF" />
</svg>
