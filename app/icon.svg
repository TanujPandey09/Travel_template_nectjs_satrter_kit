<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="traveli_gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5B37" />
      <stop offset="1" stop-color="#FFA07A" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded squircle -->
  <rect width="32" height="32" rx="9" fill="url(#traveli_gradient)" />
  
  <!-- Outer Compass Ring -->
  <circle cx="16" cy="16" r="9.5" stroke="white" stroke-width="1.8" />
  
  <!-- 4 Cardinal Tick Marks -->
  <line x1="16" y1="5.5" x2="16" y2="7.5" stroke="white" stroke-width="1.6" stroke-linecap="round" />
  <line x1="16" y1="24.5" x2="16" y2="26.5" stroke="white" stroke-width="1.6" stroke-linecap="round" />
  <line x1="5.5" y1="16" x2="7.5" y2="16" stroke="white" stroke-width="1.6" stroke-linecap="round" />
  <line x1="24.5" y1="16" x2="26.5" y2="16" stroke="white" stroke-width="1.6" stroke-linecap="round" />
  
  <!-- Compass Needle (North-East direction) -->
  <polygon points="19.5,12.5 14,15 12.5,19.5 17,17" fill="white" />
  <polygon points="19.5,12.5 16,16 14,15" fill="#FF441D" />
  
  <!-- Center Pivot Pin -->
  <circle cx="16" cy="16" r="1.5" fill="white" />
</svg>

